name: Collect Realtime Facility Status

on:
  # Refresh data when realtime collection/merge code changes. Data-only merges
  # are deliberately excluded, so this cannot loop on the collector's own PRs.
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-realtime.yml'
      - 'scripts/collect.js'
      - 'scripts/api/**'
      - 'scripts/merge-data-pr.js'
  schedule:
    - cron: '0 2,5,8,11,14,20,23 * * *'   # Every 1.5 hours during Seoul Metro operating hours (05:00~00:59 KST, UTC+9)
    - cron: '30 0,3,6,9,12,15,21 * * *'   # Half-hour slots for 90-minute interval
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize collection and merge across all three collectors.
# GitHub keeps at most one pending run per concurrency group.
concurrency:
  group: data-collection-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Test collection pipeline
        run: npm test
        working-directory: scripts

      - name: Collect all realtime facilities
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: node collect.js --all-realtime
        working-directory: scripts

      - name: Build latest.json
        run: node build-latest.js
        working-directory: scripts

      - name: Validate generated snapshot
        run: node validate.js
        working-directory: scripts

      - name: Create pull request with data
        id: cpr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7
        with:
          commit-message: 'chore: collect realtime data'
          branch: auto/collect-realtime
          title: 'chore: collect realtime data'
          body: 'Automated realtime facility data collection.'
          add-paths: |
            data/realtime/**
            data/.last-hashes.json

      - name: Merge data PR and verify completion
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_BRANCH: auto/collect-realtime
        run: node scripts/merge-data-pr.js
