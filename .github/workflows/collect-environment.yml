name: Collect Environment Data

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize collection and merge across all three collectors.
# GitHub keeps at most one pending run per concurrency group.
concurrency:
  group: data-collection-main
  cancel-in-progress: false

jobs:
  collect-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Test collection pipeline
        run: npm test
        working-directory: scripts

      - name: Collect environment data
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: node collect-environment.js
        working-directory: scripts

      - name: Build latest.json
        run: node build-latest.js
        working-directory: scripts

      - name: Validate generated snapshot
        run: node validate.js
        working-directory: scripts

      - name: Create pull request with data
        id: cpr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7
        with:
          commit-message: 'chore: collect environment data'
          branch: auto/collect-environment
          title: 'chore: collect environment data'
          body: 'Automated environment data collection.'
          add-paths: |
            data-static/air-quality.json
            data-static/.last-env-hash.json

      - name: Merge data PR and verify completion
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_BRANCH: auto/collect-environment
        run: node scripts/merge-data-pr.js
